name: Build

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: PNPM
        uses: pnpm/action-setup@v6
  
      - name: Installation
        run: pnpm i --frozen-lockfile

      - name: Create config
        run: | 
          echo $CONFIG_JSON > ./src/config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_FILE }}

      - name: Lint
        run: pnpm lint

      - name: Build
        run: npx tsc